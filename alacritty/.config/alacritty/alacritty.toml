[general]
# import = ["~/.config/alacritty/themes/themes/tokyonight_night.toml"]
import = ["~/.config/alacritty/themes/themes/carbonfox.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[window]
opacity = 0.95
decorations = "none"
padding = { x = 8, y = 8 }
# dynamic_padding = true

[window.dimensions]
columns = 160
lines = 39

[cursor]
style = { shape = "Block", blinking = "Always" }

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
]

[mouse]
bindings = [
  { mouse = "Right", action = "Copy" },
]
