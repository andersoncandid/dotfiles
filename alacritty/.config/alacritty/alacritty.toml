[general]
import = ["~/.config/alacritty/tokyonight_night.toml"]

[env]
TERM = "xterm-256color"

[font]
size = 14.0

[font.normal]
family = "JetBrainsMonoNL Nerd Font"
style = "Regular"

[window]
opacity = 0.95
padding = { x = 6, y = 6 }

[window.dimensions]
columns = 160
lines = 39

[cursor]
style = { shape = "Block", blinking = "Always" }

[keyboard]
bindings = [
  { key = "V", mods = "Control|Shift", action = "Paste" },
  { key = "C", mods = "Control|Shift", action = "Copy" },
]

[mouse]
bindings = [
  { mouse = "Right", action = "Copy" },
]
