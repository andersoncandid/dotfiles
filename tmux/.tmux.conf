#=== Geral Settings ===#

# Vim-Style command prompt
set -g status-keys vi

# Fix Vim ESC delay (tmux 3.5+ already defaults to 10ms)
set -sg escape-time 0

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse support
set -g mouse on

# Set terminal with proper colors
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

#=== KeyBindings ===#

# Change prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g prefix2 C-j
bind C-j send-prefix -2

# Reload config
bind-key r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded."

# Better window split keys (keep current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Change clock and new-window keys
unbind t
unbind c
bind t new-window
bind c clock-mode

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
 
# Vim-style pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Synchronize panes
bind-key y set-window-option synchronize-panes\; display-message "synchronize mode toggled."

#=== Copy Mode ===#

# Use vi keys
setw -g mode-keys vi

# Vi-style copy bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
set -g set-clipboard on

#=== Appearance ===#

# Status bar position
set -g status-position top

# Theme from plugin
# set -g @catppuccin_window_status_style "rounded"

# status bar transparent
set -g @catppuccin_status_background "none"

#=== Plugins ===#

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'

set -g status-right-length 100

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'
