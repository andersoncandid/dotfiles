################# DISPLAY ####################

no_display

# toggle_hud=none
toggle_hud=Shift_R+F4

################ PERFORMANCE #################

### Limit the application FPS. Comma-separated list of one or more FPS values (e.g. 0,30,60). 0 means unlimited (unless VSynced)
fps_limit=60,0

### early = wait before present, late = wait after present
fps_limit_method=late

### VSync [0-3] 0 = adaptive; 1 = off; 2 = mailbox; 3 = on
vsync=3

### OpenGL VSync [0-N] 0 = off; >=1 = wait for N v-blanks, N > 1 acts as a FPS limiter (FPS = display refresh rate / N)
# gl_vsync=-2


legacy_layout=false

round_corners=0
background_alpha=0.6
background_color=000000

font_size=24
text_color=FFFFFF
position=top-left
pci_dev=0:01:00.0
table_columns=3
gpu_text=GPU
gpu_stats
gpu_load_change
gpu_load_value=70,90
gpu_load_color=FFFFFF,FFAA7F,CC0000
gpu_mem_clock
gpu_temp
gpu_color=2E9762
cpu_text=CPU
cpu_stats

cpu_load_change
cpu_load_value=70,90
cpu_load_color=FFFFFF,FFAA7F,CC0000
cpu_temp
cpu_color=2E97CB
vram
vram_color=AD64C1
ram
ram_color=C26693
fps
frame_timing
frametime_color=00FF00
toggle_fps_limit=Shift_L+F1
show_fps_limit

fps_color_change
fps_color=B22222,FDFD09,39F900
#offset=0


output_folder=/home/anderson
log_duration=30
autostart_log=0
log_interval=100
toggle_logging=Shift_L+F2

blacklist=pamac-manager,lact,ghb,bitwig-studio,ptyxis,yumex
