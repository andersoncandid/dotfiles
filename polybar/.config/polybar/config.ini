;==========================================================

[colors]
background = ${colors.base}
background-alt = ${colors.blue}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.mantle}
alert = ${colors.red}
disabled = ${colors.subtext1}

[bar/main]
width = 100%
height = 24pt
radius = 0

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt
line-color = ${colors.background}

; border-size = 4
border-color = 

padding-left = 1
padding-right = 2

module-margin = 1

separator = 
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:weight=bold:size=12;3"
font-1 = "Symbols Nerd Font Mono:size=12;3"
font-2 = "JetBrainsMono Nerd Font:style=Medium:size=14;3"

modules-left = xworkspaces xwindow
modules-center = date
modules-right = systray pulseaudio sysmenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 8pt

[module/workspaces]
type = internal/xworkspaces

label-active = 
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = 
label-occupied-padding = 1

label-empty = 
label-empty-background = ${colors.background}
label-empty-padding = 1

[module/xworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.mauve}
label-active-foreground = ${colors.crust}
label-active-underline= ${colors.mauve}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/aworkspaces]
type = internal/xworkspaces

label-active = %name%
label-active-background = ${colors.secondary}
label-active-underline= ${colors.primary}
label-active-padding = 1

label-occupied = %name%
label-occupied-padding = 1

label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1

label-empty = %name%
label-empty-foreground = ${colors.disabled}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label =   %class:0:30:...%

[bar]
fill = ⏽
empty = ⏽
indicator = 

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false

interval = 5

reverse-scroll = false

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = <ramp-volume> <label-volume>

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-foreground = ${colors.red}

label-volume = %percentage%%

label-muted = " Muted"
; label-muted = " ⏽⏽⏽⏽⏽⏽⏽⏽⏽⏽"
label-muted-foreground = ${colors.surface1}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.blue}

;=== Only applies if <bar-volume> is used ===;
; bar-volume-format = "%fill%%indicator%%empty%"
; bar-volume-width = 11
; bar-volume-gradient = false
;
; bar-volume-indicator = ${bar.indicator}
; bar-volume-indicator-foreground = ${colors.foreground}
;
; bar-volume-fill = ${bar.fill}
; bar-volume-foreground-0 = ${colors.green}
; bar-volume-foreground-1 = ${colors.green}
; bar-volume-foreground-2 = ${colors.yellow}
; bar-volume-foreground-3 = ${colors.yellow}
; bar-volume-foreground-4 = ${colors.red}
;
; bar-volume-empty = ${bar.empty}
; bar-volume-empty-foreground = ${colors.surface1}

click-right = cinnamon-settings sound &

[module/battery]
type = internal/battery
format-prefix = "BAT "
format-prefix-foreground = ${colors.primary}
full-at = 99
format-charging = <animation-charging> <label-charging>
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
low-at = 5
battery = BAT1
adapter = ACAD
poll-interval = 5

[module/date]
type = internal/date
interval = 1

date = %H:%M
date-alt = %a, %d %B %Y  %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/settings]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 0

label = %{T3}%{T-}
click-left = cinnamon-settings &
click-right = pkill -f cinnamon-settings

[module/sysmenu]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.foreground}
format-padding = 0

label = %{T3}%{T-}
click-right = cinnamon-settings &
click-left = ~/.config/polybar/scripts/powermenu.sh &

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
