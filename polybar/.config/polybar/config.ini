[global/wm]
include-file = $HOME/.config/polybar/catppuccin-mocha.ini

;== Gnome colors ==
; background = #1f1f1f
; background-alt = #2a2a2a
; foreground = #FFFFFF
; primary = #ffb300

[colors]
background=${colors.mantle}
background-alt = ${colors.crust}
foreground = ${colors.text}
primary = ${colors.mauve}
secondary = ${colors.blue}
alert = ${colors.red}
disabled = ${colors.overlay0}

[bar/main]
width = 100%
height = 22pt
radius = 0

fixed-center = true

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2pt

border-bottom-size = 1pt
border-color=${colors.base}
# border-color= #282828

padding-left = 1
padding-right = 2

module-margin = 0
separator = " | "
separator-foreground = ${colors.surface2}

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=12;3"
font-1 = "JetBrainsMono Nerd Font:style=Medium:size=13;3"

modules-left = i3 xwindow
modules-center =
modules-right = systray pulseaudio date sysmenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 0pt
tray-spacing = 8pt

[module/xwindow]
type = internal/xwindow
label = "   %class:0:20:...%"
label-foreground = ${colors.foreground}

[bar]
fill = |
empty = |
indicator =

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
interval = 5
reverse-scroll = false

; Available tags:
;   <label-volume> (default)
;   <ramp-volume>
;   <bar-volume>
format-volume = %{T2}󰕾%{T-} <label-volume>

format-muted-prefix = %{T2}󰝟%{T-}

label-volume = %percentage%%

label-muted = " Muted"
label-muted-foreground = ${colors.red}

ramp-volume-0 = %{T2}󰕿%{T-}
ramp-volume-1 = %{T2}󰖀%{T-}
ramp-volume-2 = %{T2}󰖀%{T-}
ramp-volume-3 = %{T2}󰕾%{T-}
ramp-volume-4 = %{T2}󰕾%{T-}
# ramp-volume-foreground = ${colors.sapphire}

; Only works if <bar-volume> is used
bar-volume-format = "%fill%%indicator%%empty%"
bar-volume-width = 11
bar-volume-gradient = false

bar-volume-indicator = ${bar.indicator}
bar-volume-indicator-foreground = ${colors.foreground}

bar-volume-fill = ${bar.fill}
bar-volume-foreground-0 = ${colors.green}
bar-volume-foreground-1 = ${colors.green}
bar-volume-foreground-2 = ${colors.yellow}
bar-volume-foreground-3 = ${colors.yellow}
bar-volume-foreground-4 = ${colors.red}

bar-volume-empty = ${bar.empty}
bar-volume-empty-foreground = ${colors.foreground}

click-right = pavucontrol &

[module/date]
type = internal/date
interval = 1

date = %H:%M%
date-alt = %a, %d %B %Y %H:%M

label = %date%
label-foreground = ${colors.foreground}

[module/sysmenu]
type = custom/text

format = <label>
format-foreground = ${colors.foreground}
format-padding = 0

label = " "
click-right = xfce4-settings-manager &
click-left = ~/.config/rofi/powermenu/powermenu.sh &

[module/i3]
type = internal/i3

show-urgent = true

format = <label-state> <label-mode>

label-mode = %mode%
label-mode-padding = 2
label-mode-foreground = #000000
label-mode-background = ${colors.alert}

label-focused = %{T2}󱓻%{T-}
; label-focused = %index%
label-focused-foreground = ${colors.foreground}
; label-focused-background = ${colors.background-alt}
; label-focused-underline = ${colors.secondary}
label-focused-padding = 1

label-unfocused = %index%
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-foreground = ${colors.alert}
label-urgent-background = ${colors.base}
label-urgent-padding = 1

label-separator =
label-separator-padding = 0
label-separator-foreground = ${colors.disabled}

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
