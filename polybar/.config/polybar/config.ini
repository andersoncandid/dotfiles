[colors]
;; Fundo mais escuro > desligue a borda
background = #11111b
background-alt = #1e1e2e

; background = #1e1e2e
; background-alt = #313244

foreground = #cdd6f4
primary = #89b4fa
secondary = #94e2d5
alert = #f38ba8
disabled = #6c7086

[bar/main]
width = 100%
height = 24pt
radius = 0

fixed-center = true

; dpi = 96

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

; border-bottom-size = 1pt
; border-bottom-color = #313244

padding-left = 1
padding-right = 1

module-margin = 1
separator = |
separator-foreground = ${colors.disabled}

font-0 = "JetBrainsMono Nerd Font:style=Medium:size=13;3"
font-1 = "JetBrainsMono Nerd Font:style=Medium:size=14;3"

modules-left = workspaces xwindow
modules-center = date
modules-right = systray pulseaudio sysmenu

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

; wm-restack = generic
; wm-restack = bspwm
; wm-restack = i3

; override-redirect = true

[module/systray]
type = internal/tray

format-margin = 8pt
tray-spacing = 16pt

[module/workspaces]
type = internal/xworkspaces

label-active = 
label-active-foreground = ${colors.foreground}
label-active-padding = 1

label-occupied = 
label-occupied-padding = 1

label-empty = 
label-empty-background = ${colors.background}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label =   %class:0:30:...%

[module/pulseaudio]
type = internal/pulseaudio

use-ui-max = false
interval = 5
reverse-scroll = false

format-volume = <ramp-volume> <label-volume>

format-muted = <label-muted>
format-muted-prefix = 
format-muted-prefix-foreground = ${colors.alert}

label-volume = %percentage%%

label-muted = " muted"
label-muted-foreground = ${colors.disabled}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-3 = 
ramp-volume-foreground = ${colors.primary}

click-right = pavucontrol &

[module/date]
type = internal/date
interval = 1

date = %H:%M%
date-alt = %a, %d %B %Y  %H:%M:%S

label = %date%
label-foreground = ${colors.primary}

[module/battery]
type = internal/battery
format-prefix = "BAT "
format-prefix-foreground = ${colors.primary}
full-at = 99
format-charging = <animation-charging> <label-charging>
animation-charging-0 = 
animation-charging-1 = 
animation-charging-2 = 
animation-charging-3 = 
animation-charging-4 = 
; Framerate in milliseconds
animation-charging-framerate = 750
animation-charging-foreground = ${colors.peach}
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
low-at = 5
battery = BAT1
adapter = ACAD
poll-interval = 5

[module/sysmenu]
type = custom/text

format = <label>
format-background = ${colors.background}
format-foreground = ${colors.primary}
format-padding = 0

label = %{T2} %{T-}
click-right = xfce4-settings-manager &
click-left = ~/.config/rofi/powermenu/powermenu.sh &

[module/polypomo]
type = custom/script
exec = ~/.config/polybar/modules/polypomo
tail = true
label = %output%
click-left = ~/.config/polybar/modules/polypomo toggle
click-right = ~/.config/polybar/modules/polypomo end
click-middle = ~/.config/polybar/modules/polypomo lock
scroll-up = ~/.config/polybar/modules/polypomo time +60
scroll-down = ~/.config/polybar/modules/polypomo time -60

[settings]
screenchange-reload = true
pseudo-transparency = true

; vim:ft=dosini
